name: Deploy backend to Yandex Cloud

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/advisor/**'
      - 'content/character-creation.json'
      - 'content/character-abilities.json'
      - 'content/races.json'
      - 'content/world-map.json'
      - 'content/rules.json'
      - '.github/workflows/deploy-yandex-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: yandex-backend
  cancel-in-progress: false

env:
  YC_FOLDER_ID: b1g8siv8ve2si1qp04nm
  YC_REGISTRY_ID: crp3ok452qdp2r44ene5
  YC_BACKEND_SA_ID: aje20v69nl71ka3gjm66
  YC_RUNTIME_SA_ID: aje99fiebjm3lg4k2fpk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dnd_test?sslmode=disable
      CONTRACT_FIXTURE_DIR: /tmp/dnd-api-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/
            /content/character-creation.json
            /content/character-abilities.json
            /content/races.json
            /content/world-map.json
            /content/rules.json
            /shared/api/openapi.yaml
            /shared/advisor/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test and vet
        working-directory: backend
        run: |
          python3 -m unittest discover -s scripts -p 'test_code_style.py'
          python3 scripts/check_code_style.py
          go test -race ./...
          go vet ./...
          python3 -m venv "$RUNNER_TEMP/dnd-schema-venv"
          "$RUNNER_TEMP/dnd-schema-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
          "$RUNNER_TEMP/dnd-schema-venv/bin/python" scripts/verify_api_responses.py "$CONTRACT_FIXTURE_DIR"

      - name: Login to Container Registry with OIDC
        uses: yc-actions/yc-cr-login@ee42362bcacb854964afa3a3180ca8ae6dd388f8 # v3.0.2, OIDC
        with:
          yc-sa-id: ${{ env.YC_BACKEND_SA_ID }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: cr.yandex/${{ env.YC_REGISTRY_ID }}/dnd-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy private container revision
        uses: yc-actions/yc-sls-container-deploy@4d43a2554afca02dca947a10fc29ae6239378c55 # v5.0.0
        with:
          yc-sa-id: ${{ env.YC_BACKEND_SA_ID }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          container-name: dnd-api
          revision-service-account-id: ${{ env.YC_RUNTIME_SA_ID }}
          revision-image-url: cr.yandex/${{ env.YC_REGISTRY_ID }}/dnd-api:${{ github.sha }}
          revision-cores: '1'
          revision-memory: 512Mb
          revision-core-fraction: '100'
          revision-concurrency: '12'
          revision-execution-timeout: '30'
          revision-provisioned: '0'
          revision-zone-instances-limit: '1'
          revision-network-id: enpeeej3ge2i9lqn8cer
          revision-log-options-folder-id: ${{ env.YC_FOLDER_ID }}
          revision-env: |
            ADVISOR_CHAT_ENABLED=${{ vars.DND_ADVISOR_CHAT_ENABLED || 'false' }}
            ADVISOR_FOLDER_ID=${{ env.YC_FOLDER_ID }}
            ASSET_BUCKET=dnd-character-media-b1g8siv8ve2si1qp04nm
            DB_HOST=rc1b-9l6pgd7u2a2cnrg9.mdb.yandexcloud.net
            DB_PORT=6432
            DB_USER=dnd_api
            DB_NAME=dnd
            CORS_ALLOWED_ORIGINS=http://dnd-etozhenerk-b1g8siv8ve2si1qp04nm.website.yandexcloud.net,https://dnd-etozhenerk-b1g8siv8ve2si1qp04nm.website.yandexcloud.net,https://etozhenerk.github.io
          revision-secrets: |
            DB_PASSWORD=e6q52abgke68mcms2ntu/e6qcp09mdr8hvlce0tra/postgresql_password

      - name: Smoke test HTTPS API and database
        env:
          API_URL: https://d5dopqqib47kpsh6929m.jki8ffxa.apigw.yandexcloud.net
        run: |
          for route in health creator/options creator/advisor characters; do
            curl --fail --silent --show-error --max-time 40 \
              --retry 6 --retry-delay 5 --retry-all-errors \
              "$API_URL/$route" > /dev/null
          done
