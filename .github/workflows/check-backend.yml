name: Check Go backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - shared/api/**
      - shared/advisor/**
      - content/character-creation.json
      - content/character-abilities.json
      - content/races.json
      - content/world-map.json
      - content/rules.json
      - .github/workflows/check-backend.yml
  pull_request:
    paths:
      - backend/**
      - shared/api/**
      - shared/advisor/**
      - content/character-creation.json
      - content/character-abilities.json
      - content/races.json
      - content/world-map.json
      - content/rules.json
      - .github/workflows/check-backend.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dnd_test?sslmode=disable
      CONTRACT_FIXTURE_DIR: /tmp/dnd-api-fixtures
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/
            /content/character-creation.json
            /content/character-abilities.json
            /content/races.json
            /content/world-map.json
            /content/rules.json
            /shared/api/openapi.yaml
            /shared/advisor/
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify format gate and check new Go files
        run: |
          python3 -m unittest discover -s scripts -p 'test_code_style.py'
          python3 scripts/check_code_style.py
      - run: go test -race ./...
      - name: Check HTTP responses against OpenAPI
        run: |
          python3 -m venv "$RUNNER_TEMP/dnd-schema-venv"
          "$RUNNER_TEMP/dnd-schema-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
          "$RUNNER_TEMP/dnd-schema-venv/bin/python" scripts/verify_api_responses.py "$CONTRACT_FIXTURE_DIR"
      - run: go vet ./...
      - run: go build ./cmd/api
