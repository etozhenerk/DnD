openapi: 3.1.0
info:
  title: Хроники Восьми Земель API
  version: 0.10.0
  description: Конструктор новых персонажей. Готовые герои книги остаются в content/.
x-ability-rules-source: content/character-abilities.json
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверить доступность API
      responses:
        '200':
          description: API работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /creator/options:
    get:
      operationId: getCreatorOptions
      summary: Получить версию конструктора, правила характеристик, навыков и расы
      responses:
        '200':
          description: Канонические правила и игровые расы
          headers:
            Server-Timing: {$ref: '#/components/headers/ServerTiming'}
            Cache-Control: {$ref: '#/components/headers/ReadCacheControl'}
          content:
            application/json:
              schema:
                type: object
                required: [rulesetId, rules, races, abilityRules]
                properties:
                  rulesetId: {type: string, const: character-creation-v3}
                  abilityRules: {$ref: '#/components/schemas/AbilityRules'}
                  rules:
                    type: object
                    properties:
                      classSelection:
                        type: object
                        required: [explanation, skillExplanation]
                        properties:
                          explanation: {type: string}
                          skillExplanation: {type: string}
                      classFoundation:
                        type: object
                        required: [rulesetId, baseBudget, bonusBudget]
                        properties:
                          rulesetId: {type: string, const: character-creation-v3}
                          baseBudget: {type: integer, const: 10}
                          bonusBudget: {type: integer, const: 4}
                      classProfiles:
                        type: array
                        items: {$ref: '#/components/schemas/CreatorClassProfile'}
                  races:
                    type: array
                    items: {type: object}
  /creator/advisor:
    get:
      operationId: getCreatorAdvisor
      summary: Получить бесплатные подсказки и доступные возможности советника
      description: |
        Не создаёт сессию, не сохраняет анкету и не вызывает LLM.
        chat включается только при настроенных AI Studio и учёте расходов.
      responses:
        '200':
          description: Публичный каталог советника
          headers:
            Server-Timing: {$ref: '#/components/headers/ServerTiming'}
            Cache-Control: {$ref: '#/components/headers/ReadCacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdvisorGuide'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /advisor/sessions:
    post:
      operationId: createAdvisorSession
      summary: Начать отдельный диалог с советником
      description: |
        Не создаёт черновик анкеты. Токен выдаётся один раз, хранится только в памяти
        страницы. Сессия действует 24 часа, бюджет 200 ₽, общий месячный предел 10000 ₽.
        Создание сессии не вызывает LLM. Не более 12 новых сессий за минуту и 60 за сутки
        на весь сервис. Без авторизации это ограничение сессии, а не личности игрока.
      responses:
        '201':
          description: Сессия и её секрет
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdvisorSessionCreated'}
        '429': {$ref: '#/components/responses/AdvisorLimit'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /advisor/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/AdvisorSessionId'
    get:
      operationId: getAdvisorSession
      summary: Прочитать историю и остаток бюджета своей сессии
      security: [{AdvisorToken: []}]
      responses:
        '200':
          description: До 100 запросов сессии, без снимков анкеты и токена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdvisorSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /advisor/sessions/{sessionId}/images/{requestId}:
    parameters:
      - $ref: '#/components/parameters/AdvisorSessionId'
      - name: requestId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAdvisorImage
      security: [{AdvisorToken: []}]
      description: Бинарный результат доступен только с секретом сессии. Не публикует изображение в книге или списке персонажей.
      responses:
        '200':
          description: Подготовленный портрет или иконка.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /advisor/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/AdvisorSessionId'
    post:
      operationId: sendAdvisorMessage
      summary: Получить совет с учётом текущего этапа и публичного лора
      security: [{AdvisorToken: []}]
      description: |
        Один активный запрос на сессию, до 6 во всём сервисе. Резерв стоимости
        фиксируется до вызова провайдера. Повтор того же requestId и тела возвращает
        прежний результат без повторной генерации. Иное тело с тем же ID — 409.
        Неясный исход или обрыв сохраняет резерв и блокирует новые сообщения сессии
        до административной сверки. GET сессии позволяет проверить потерянный ответ.
        Контекст анкеты используется для этого вызова и не сохраняется в БД;
        совет не меняет персонажа. Формат ответа — текст Markdown, без HTML.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdvisorMessageInput'}
      responses:
        '200':
          description: Ответ или ранее завершённый запрос
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdvisorSession'}
        '202':
          description: Такой запрос уже выполняется или его исход пока неизвестен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdvisorSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/AdvisorLimit'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /drafts:
    post:
      operationId: createDraft
      summary: Начать черновик после входа
      description: Авторизация ещё не подключена. Маршрут всегда возвращает 403, в том числе со старым токеном черновика. Доступ и контракт записи будут включены после проверки личности пользователя и владельца анкеты.
      responses:
        '403': {$ref: '#/components/responses/DraftsRequireAuthentication'}
  /drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: getDraft
      summary: Восстановить свой черновик после входа
      description: Авторизация ещё не подключена. Маршрут всегда возвращает 403, в том числе со старым токеном черновика. Доступ и контракт записи будут включены после проверки личности пользователя и владельца анкеты.
      responses:
        '403': {$ref: '#/components/responses/DraftsRequireAuthentication'}
    patch:
      operationId: patchDraft
      summary: Сохранить раздел своего черновика после входа
      description: Авторизация ещё не подключена. Маршрут всегда возвращает 403, в том числе со старым токеном черновика. Доступ и контракт записи будут включены после проверки личности пользователя и владельца анкеты.
      responses:
        '403': {$ref: '#/components/responses/DraftsRequireAuthentication'}
  /drafts/{draftId}/advice:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      operationId: adviseDraft
      summary: Запросить подсказку для своего черновика
      description: Авторизация ещё не подключена. Маршрут всегда возвращает 403, в том числе со старым токеном черновика. Доступ и контракт записи будут включены после проверки личности пользователя и владельца анкеты.
      responses:
        '403': {$ref: '#/components/responses/DraftsRequireAuthentication'}
  /drafts/{draftId}/assets:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      operationId: uploadDraftAsset
      summary: Загрузить файл для своего черновика
      description: Авторизация ещё не подключена. Маршрут всегда возвращает 403, в том числе со старым токеном черновика. Доступ и контракт записи будут включены после проверки личности пользователя и владельца анкеты.
      responses:
        '403': {$ref: '#/components/responses/DraftsRequireAuthentication'}
  /drafts/{draftId}/validate:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      operationId: validateDraft
      summary: Проверить свой черновик
      description: Авторизация ещё не подключена. Маршрут всегда возвращает 403, в том числе со старым токеном черновика. Доступ и контракт записи будут включены после проверки личности пользователя и владельца анкеты.
      responses:
        '403': {$ref: '#/components/responses/DraftsRequireAuthentication'}
  /drafts/{draftId}/complete:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      operationId: completeDraft
      summary: Завершить свой черновик
      description: Авторизация ещё не подключена. Маршрут всегда возвращает 403, в том числе со старым токеном черновика. Доступ и контракт записи будут включены после проверки личности пользователя и владельца анкеты.
      responses:
        '403': {$ref: '#/components/responses/DraftsRequireAuthentication'}
  /assets/{assetId}:
    get:
      operationId: getCharacterAsset
      summary: Прочитать проверенное изображение готового персонажа
      parameters:
        - name: assetId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Неизменяемое изображение; Cache-Control public, max-age=31536000, immutable
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /characters:
    post:
      operationId: createCharacter
      summary: Сохранить целую готовую анкету без черновика
      description: |
        Публичное создание по текущим правилам character-creation-v3. Создатель — NULL до авторизации.
        requestId — UUID одной попытки сохранения и ID будущей карточки. Повтор с той же
        нормализованной анкетой возвращает существующую карточку; другая анкета с тем же ID — 409.
        Сервер рассчитывает HP/AC и эффекты. Для изображений используйте multipart/form-data:
        character — JSON анкеты, portrait — выбранный портрет, icon:<abilityId> — до трёх иконок активных навыков.
        Файлы — бинарные PNG/JPEG: портрет до 1 МиБ и 1600 px, иконка до 128 КиБ и 512 px по длинной стороне.
        Лимит JSON — 256 КиБ, всего multipart — 2 МиБ. Изображения проверяются сервером,
        ссылки и метаданные создаются одной транзакцией вместе с героем. Черновики и редактирование остаются закрыты.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCharacter'}
          multipart/form-data:
            schema:
              type: object
              required: [character]
              maxProperties: 5
              additionalProperties: false
              properties:
                character: {$ref: '#/components/schemas/CreateCharacter'}
                portrait: {type: string, format: binary}
              patternProperties:
                '^icon:[a-z0-9]+(-[a-z0-9]+)*$': {type: string, format: binary}
            encoding:
              character: {contentType: application/json}
              portrait: {contentType: 'image/png, image/jpeg'}
            x-max-body-bytes: 2097152
      responses:
        '201':
          description: Персонаж, навыки и предметы сохранены одной транзакцией
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Character'}
        '200':
          description: Повтор ранее успешного сохранения, без новой записи
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Character'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: requestId уже занят другой анкетой; код creation_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: Превышен лимит JSON или multipart; код request_too_large
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Анкета не прошла проверку, ни одна строка не создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Validation'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500':
          description: Сбой сохранения; повтор с тем же requestId безопасен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      operationId: listCharacters
      summary: Список готовых персонажей конструктора
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: fresh
          in: query
          description: Обойти кэш процесса после сохранения, чтобы увидеть запись через любой экземпляр API.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Готовые персонажи, новые первыми
          headers:
            Server-Timing: {$ref: '#/components/headers/ServerTiming'}
            Cache-Control: {$ref: '#/components/headers/ReadCacheControl'}
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CharacterSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /characters/{characterId}:
    parameters:
      - name: characterId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getCharacter
      summary: Прочитать готового персонажа, навыки и предметы
      responses:
        '200':
          description: Готовый персонаж
          headers:
            Server-Timing: {$ref: '#/components/headers/ServerTiming'}
            Cache-Control: {$ref: '#/components/headers/ReadCacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Character'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    AdvisorToken:
      type: http
      scheme: bearer
      description: Случайный секрет отдельной сессии советника, не авторизация игрока.
  headers:
    ServerTiming:
      description: Длительность обработки публичного чтения в процессе API (app;dur, миллисекунды) и результат серверного кэша (read_cache;desc, hit или miss). Не включает запуск контейнера и сетевой путь до него.
      schema: {type: string}
    ReadCacheControl:
      description: no-store. Браузерный HTTP-кэш не используется; актуальность публичных данных контролируют TanStack Query и короткий кэш процесса API.
      schema: {type: string, const: no-store}
  parameters:
    AdvisorSessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DraftId:
      name: draftId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    AdvisorMessageInput:
      type: object
      additionalProperties: false
      required: [requestId, message, context]
      allOf:
        - if:
            required: [mode]
            properties: {mode: {const: suggest}}
          then:
            required: [target]
            properties: {target: {enum: [name, appearance, race, class, abilities, equipment]}}
        - if:
            required: [mode]
            properties: {mode: {const: icon}}
          then:
            required: [target]
            properties: {target: {minLength: 1, pattern: '\S'}}
        - if:
            not:
              required: [mode]
              properties: {mode: {enum: [suggest, icon]}}
          then:
            properties: {target: {const: ''}}
      x-max-body-bytes: 16384
      properties:
        requestId: {type: string, format: uuid}
        message: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        mode:
          type: string
          enum: [chat, comment, suggest, fill, portrait, icon]
          default: chat
          description: chat — диалог с инструментами заполнения и рисования; comment — короткая заметка; suggest — предложение для target; fill — полная анкета; portrait/icon — изображение. Применяет игрок.
        target: {type: string, maxLength: 80, description: Поле предложения или ID навыка для иконки.}
        context:
          type: object
          additionalProperties: false
          required: [stepId, name, raceId, classId, concept]
          properties:
            stepId: {type: string, enum: [appearance, race, class, attributes, abilities, equipment, review]}
            name: {type: string, maxLength: 120}
            raceId: {type: string, maxLength: 80}
            classId: {type: string, maxLength: 80}
            concept: {type: string, maxLength: 2000}
            formData:
              type: object
              description: Ограниченный снимок текущей анкеты, не сохраняется в БД.
              x-max-json-bytes: 12288
              additionalProperties: false
              properties:
                appearance: {type: object}
                race: {type: object}
                class: {type: object}
                attributes: {type: object}
                abilities: {type: object}
                equipment: {type: object}
    AdvisorTurn:
      type: object
      additionalProperties: false
      required: [requestId, message, reply, status, accountedMicroRub, createdAt]
      properties:
        requestId: {type: string, format: uuid}
        message: {type: string, maxLength: 2000}
        reply: {type: string, maxLength: 16000}
        proposal: {$ref: '#/components/schemas/AdvisorProposal'}
        mode: {type: string, enum: [chat, comment, suggest, fill, portrait, icon]}
        target: {type: string, maxLength: 80}
        image: {$ref: '#/components/schemas/AdvisorImage'}
        action: {$ref: '#/components/schemas/AdvisorImageAction'}
        status: {type: string, enum: [reserved, succeeded, uncertain], description: uncertain сохраняет финансовый резерв, но позволяет отправить новую реплику.}
        accountedMicroRub: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    AdvisorProposal:
      type: object
      additionalProperties: false
      required: [formData]
      description: Полная анкета без изображений, проверенная текущими правилами. Не создаёт персонажа и не является черновиком.
      properties:
        formData: {$ref: '#/components/schemas/CompleteCharacterForm'}
        target: {type: string, enum: [name, appearance, race, class, abilities, equipment]}
    AdvisorImageAction:
      type: object
      additionalProperties: false
      required: [requestId, kind, prompt]
      description: Проверенное поручение рисования из чата. Клиент исполняет один раз отдельным запросом portrait/icon с указанным UUID и исходным снимком анкеты; чтение истории ничего не запускает.
      properties:
        requestId: {type: string, format: uuid}
        kind: {type: string, enum: [portrait, icon]}
        prompt: {type: string, minLength: 1, maxLength: 500}
        target: {type: string, maxLength: 80}
    AdvisorImage:
      type: object
      additionalProperties: false
      required: [requestId, kind, mimeType]
      properties:
        requestId: {type: string, format: uuid}
        kind: {type: string, enum: [portrait, icon]}
        target: {type: string, maxLength: 80}
        mimeType: {type: string, enum: [image/jpeg, image/png]}
    AdvisorSession:
      type: object
      additionalProperties: false
      required: [id, expiresAt, budgetMicroRub, accountedMicroRub, turns]
      properties:
        id: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        budgetMicroRub: {type: integer, const: 200000000}
        accountedMicroRub: {type: integer, minimum: 0}
        turns:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AdvisorTurn'}
    AdvisorSessionCreated:
      type: object
      additionalProperties: false
      required: [session, token]
      properties:
        session: {$ref: '#/components/schemas/AdvisorSession'}
        token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    AdvisorStep:
      type: object
      additionalProperties: false
      required: [id, intro, text, placeholder]
      properties:
        id: {type: string, enum: [appearance, race, class, attributes, abilities, equipment, review]}
        intro: {type: string, minLength: 1, maxLength: 120}
        text: {type: string, minLength: 1, maxLength: 600}
        placeholder: {type: string, minLength: 1, maxLength: 160}
    AdvisorGuide:
      type: object
      additionalProperties: false
      required: [version, budgetRub, capabilities, steps]
      properties:
        version: {type: string, const: character-advisor-v1}
        budgetRub: {type: integer, const: 200}
        capabilities:
          type: object
          additionalProperties: false
          required: [stepHints, chat, proactiveComments, fillCharacter, images]
          properties:
            stepHints: {type: boolean, const: true}
            chat: {type: boolean}
            proactiveComments: {type: boolean}
            fillCharacter: {type: boolean}
            images: {type: boolean}
        steps:
          type: array
          minItems: 7
          maxItems: 7
          items: {$ref: '#/components/schemas/AdvisorStep'}
    CreateCharacter:
      type: object
      additionalProperties: false
      required: [requestId, rulesetId, formData]
      x-max-body-bytes: 262144
      properties:
        requestId: {type: string, format: uuid}
        rulesetId: {type: string, const: character-creation-v3}
        formData: {$ref: '#/components/schemas/CompleteCharacterForm'}
    CompleteCharacterForm:
      type: object
      additionalProperties: false
      required: [appearance, race, class, attributes, abilities, equipment]
      properties:
        appearance:
          type: object
          additionalProperties: false
          required: [displayName]
          properties:
            displayName: {type: string, minLength: 1, maxLength: 120, pattern: '\S'}
            pronouns: {type: string, maxLength: 4000}
            roleLabel: {type: string, maxLength: 4000}
            story: {type: string, maxLength: 4000}
            motivation: {type: string, maxLength: 4000}
            appearance: {type: string, maxLength: 4000}
            personality:
              type: array
              maxItems: 20
              items: {type: string, maxLength: 120}
        race:
          type: object
          additionalProperties: false
          required: [raceId]
          properties:
            raceId: {type: string}
        class:
          type: object
          additionalProperties: false
          required: [classId]
          properties:
            classId: {type: string}
        attributes:
          type: object
          additionalProperties: false
          required: [strength, dexterity, constitution, wisdom, intelligence, charisma]
          properties:
            strength: {type: integer, minimum: -4, maximum: 4}
            dexterity: {type: integer, minimum: -4, maximum: 4}
            constitution: {type: integer, minimum: -4, maximum: 4}
            wisdom: {type: integer, minimum: -4, maximum: 4}
            intelligence: {type: integer, minimum: -4, maximum: 4}
            charisma: {type: integer, minimum: -4, maximum: 4}
        abilities: {$ref: '#/components/schemas/CharacterSkillsInput'}
        equipment:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              maxItems: 20
              items:
                type: object
                additionalProperties: false
                required: [id, name, description]
                properties:
                  id: {type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
                  name: {type: string, minLength: 1, maxLength: 120, pattern: '\S'}
                  description: {type: string, maxLength: 2000}
    CreatorClassProfile:
      type: object
      required: [id, name, description, playStyle, weakness, baseStats, defaultStats, baseHp, baseAc, dexterityAcCap]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        playStyle: {type: string}
        weakness:
          type: string
          description: Объяснение слабых сторон базового распределения, которые игрок может усилить.
        baseStats:
          type: object
          additionalProperties: {type: integer, minimum: -4, maximum: 4}
        defaultStats:
          type: object
          additionalProperties: {type: integer, minimum: -4, maximum: 4}
        baseHp: {type: integer}
        baseAc: {type: integer}
        dexterityAcCap: {type: integer}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Draft:
      type: object
      required: [id, rulesetId, formData, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        rulesetId: {type: string}
        formData:
          type: object
          properties:
            appearance: {$ref: '#/components/schemas/Appearance'}
            race:
              type: object
              properties:
                raceId: {type: string}
            class:
              type: object
              properties:
                classId: {type: string}
            attributes:
              type: object
              additionalProperties: {type: integer}
            abilities:
              anyOf:
                - {$ref: '#/components/schemas/PartialCharacterSkillsInput'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/Ability'}
              description: Форма определяется rulesetId черновика; старые анкеты v1 используют описательные Ability.
            equipment:
              type: object
              properties:
                items:
                  type: array
                  items: {$ref: '#/components/schemas/Item'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreatedDraft:
      allOf:
        - $ref: '#/components/schemas/Draft'
        - type: object
          required: [token]
          properties:
            token: {type: string, description: Показывается только при создании}
    PatchDraft:
      type: object
      required: [section, value]
      additionalProperties: false
      properties:
        section: {type: string, enum: [appearance, race, class, attributes, abilities, equipment]}
        value: {type: object}
    Appearance:
      type: object
      properties:
        displayName: {type: string}
        pronouns: {type: string}
        roleLabel: {type: string}
        story: {type: string}
        motivation: {type: string}
        appearance: {type: string}
        personality:
          type: array
          items: {type: string}
    Ability:
      type: object
      required: [id, name, trigger, effectText]
      properties:
        id: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string}
        description: {type: string}
        effectText: {type: string}
        trigger: {type: string}
        uses:
          type: [object, 'null']
          properties:
            scope: {type: string, enum: [turn, round, battle, location, campaign]}
            max: {type: integer, minimum: 1}
        automationMode: {type: string, const: manual}
        effects: {type: array, maxItems: 0, items: {type: object}}
      description: Описательный навык старой анкеты v1 или повествовательная особенность v2. Формальные эффекты отсутствуют.
    Item:
      type: object
      required: [id, name]
      properties:
        id: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string}
        description: {type: string}
        effectText: {type: string}
        charges:
          type: [object, 'null']
          properties:
            scope: {type: string, enum: [turn, round, battle, location, campaign]}
            max: {type: integer, minimum: 1}
    Validation:
      type: object
      required: [valid, issues]
      properties:
        valid: {type: boolean}
        issues:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: {type: string}
              code: {type: string}
              message: {type: string}
        skills: {$ref: '#/components/schemas/SkillValidation'}
        derived:
          type: object
          properties:
            maxHp: {type: integer}
            baseAc: {type: integer}
            pointsSpent: {type: integer}
    CharacterSummary:
      type: object
      required: [id, displayName, raceId, classId, maxHp, baseAc, createdAt]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
        raceId: {type: string}
        classId: {type: string}
        portraitUrl:
          type: [string, 'null']
          format: uri-reference
          description: Путь /assets/<uuid> проверенного портрета на API. Без портрета поле отсутствует; клиент использует заглушку.
        maxHp: {type: integer}
        baseAc: {type: integer}
        createdAt: {type: string, format: date-time}
    Character:
      allOf:
        - $ref: '#/components/schemas/CharacterSummary'
        - type: object
          properties:
            pronouns: {type: string}
            roleLabel: {type: string}
            story: {type: string}
            motivation: {type: string}
            appearance: {type: string}
            personality:
              type: array
              items: {type: string}
            attributes:
              type: object
              additionalProperties: {type: integer}
            abilities:
              type: array
              items:
                anyOf:
                  - {$ref: '#/components/schemas/NormalizedAbility'}
                  - {$ref: '#/components/schemas/Ability'}
            equipment:
              type: array
              items: {$ref: '#/components/schemas/Item'}
            rulesetId: {type: string}
    ModifierStat:
      type: string
      enum: [strength, dexterity, wisdom, intelligence, charisma]
    ProfileId:
      type: string
      enum:
        - damage-d8-twice
        - damage-2d6-once
        - damage-2d8-once
        - healing-d6-twice
        - healing-d8-twice
        - healing-2d6-once
        - healing-2d8-once
    BasicActionInput:
      type: object
      additionalProperties: false
      required: [name, description, modifierStat]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, pattern: '\S'}
        description: {type: string, maxLength: 2000}
        modifierStat: {$ref: '#/components/schemas/ModifierStat'}
    CustomAbilityInput:
      type: object
      additionalProperties: false
      required: [id, name, description, profileId, modifierStat]
      properties:
        id: {type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string, minLength: 1, maxLength: 120, pattern: '\S'}
        description: {type: string, maxLength: 2000}
        profileId: {$ref: '#/components/schemas/ProfileId'}
        modifierStat: {$ref: '#/components/schemas/ModifierStat'}
        iconAssetId:
          type: [string, 'null']
          format: uuid
          description: Необязательная иконка; использовать после подключения хранилища.
    NarrativeAbilityInput:
      type: object
      additionalProperties: false
      required: [id, name, description]
      properties:
        id: {type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string, minLength: 1, maxLength: 120, pattern: '\S'}
        description: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
      description: Повествовательная особенность без формального игрового усиления.
    CharacterSkillsInput:
      type: object
      additionalProperties: false
      required: [basicAction, items, narrativeItems]
      properties:
        basicAction: {$ref: '#/components/schemas/BasicActionInput'}
        items:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/CustomAbilityInput'}
        narrativeItems:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/NarrativeAbilityInput'}
      x-budget-points: 6
      x-unique-fields: [items.id, items.profileId, narrativeItems.id]
      description: |
        Полный раздел abilities для validate/complete анкеты character-creation-v2 или character-creation-v3.
        Сервер проверяет уникальность ID во всём разделе, включая reserved basic-attack,
        уникальность профилей, бюджет и существование выбранной характеристики.
        Частичный черновик можно сохранять без соблюдения required полей;
        эта полная схема применяется при validate/complete.
    AbilityProfile:
      type: object
      additionalProperties: false
      required: [id, kind, points, dice, uses, target]
      properties:
        id: {$ref: '#/components/schemas/ProfileId'}
        kind: {type: string, enum: [damage, healing]}
        points: {type: integer, minimum: 2, maximum: 4}
        dice:
          type: object
          additionalProperties: false
          required: [count, sides]
          properties:
            count: {type: integer, minimum: 1, maximum: 2}
            sides: {type: integer, enum: [6, 8]}
        uses:
          type: object
          additionalProperties: false
          required: [scope, max]
          properties:
            scope: {type: string, const: battle}
            max: {type: integer, minimum: 1, maximum: 2}
        target: {type: string, enum: [one-enemy, one-friendly]}
      description: Серверный каталог; клиент не задаёт цену, кубики или частоту.
    SkillValidation:
      type: object
      additionalProperties: false
      required: [valid, pointsSpent, pointsBudget, issues]
      properties:
        valid: {type: boolean}
        pointsSpent: {type: integer, minimum: 0}
        pointsBudget: {type: integer, const: 6}
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, code, message]
            properties:
              path: {type: string}
              code:
                type: string
                enum: [required, invalid, unknown_profile, unknown_stat, duplicate_id, duplicate_profile, too_many, too_long, budget, asset_unavailable]
              message: {type: string}
    NormalizedAbility:
      type: object
      additionalProperties: false
      required: [id, name, description, profileId, modifierStat, effectText, automationMode, trigger, effects, uses]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        profileId:
          anyOf:
            - {$ref: '#/components/schemas/ProfileId'}
            - {type: string, const: basic-attack}
        modifierStat: {$ref: '#/components/schemas/ModifierStat'}
        effectText: {type: string, readOnly: true}
        automationMode: {type: string, const: automatic, readOnly: true}
        trigger: {type: string, const: action, readOnly: true}
        effects:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [rulesetId, profileId, type, target, dice, modifierStat, modifier]
            properties:
              rulesetId: {type: string, const: character-abilities-v1}
              profileId:
                anyOf:
                  - {$ref: '#/components/schemas/ProfileId'}
                  - {type: string, const: basic-attack}
              modifier: {type: integer}
              attackBonus: {type: integer, description: Присутствует только у урона, уже включает выбранный модификатор}
              type: {type: string, enum: [damage, healing]}
              target: {type: string, enum: [one-enemy, one-friendly]}
              dice:
                type: object
                additionalProperties: false
                required: [count, sides]
                properties:
                  count: {type: integer, minimum: 1, maximum: 2}
                  sides: {type: integer, enum: [6, 8]}
              modifierStat: {$ref: '#/components/schemas/ModifierStat'}
        uses:
          type: [object, 'null']
          additionalProperties: false
          required: [scope, max]
          properties:
            scope: {type: string, const: battle}
            max: {type: integer, minimum: 1, maximum: 2}
        iconAssetId: {type: [string, 'null'], format: uuid}
        iconUrl: {type: string, format: uri-reference}
      description: |
        Результат серверной нормализации, не вход для PATCH.
        Автоматическая механика определена структурированными данными;
        её подключение к игровому runtime — последующий этап.
    PartialCharacterSkillsInput:
      type: object
      additionalProperties: false
      properties:
        basicAction:
          type: object
          additionalProperties: false
          properties:
            name: {type: string}
            description: {type: string}
            modifierStat: {type: string}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: {type: string}
              name: {type: string}
              description: {type: string}
              profileId: {type: string}
              modifierStat: {type: string}
              iconAssetId: {type: [string, 'null']}
        narrativeItems:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: {type: string}
              name: {type: string}
              description: {type: string}
      description: Неполный ввод для сохранения раздела. Вычисленные поля (effects, uses, points, effectText) не принимаются.
    AbilityRules:
      type: object
      required: [id, status, characterCreationRulesetId, sourceRulesVersion, sourceCharacterCreationRulesetId, budget, modifierStats, basicAction, profiles, resolution, narrativeAbilities]
      properties:
        id: {type: string, const: character-abilities-v1}
        status: {type: string, const: approved}
        characterCreationRulesetId: {type: string, const: character-creation-v2}
        sourceRulesVersion: {type: integer, const: 1}
        sourceCharacterCreationRulesetId: {type: string, const: character-creation-v1}
        budget: {type: object}
        modifierStats:
          type: array
          items: {$ref: '#/components/schemas/ModifierStat'}
        basicAction: {type: object}
        profiles:
          type: array
          items: {$ref: '#/components/schemas/AbilityProfile'}
        resolution: {type: object}
        narrativeAbilities: {type: object}
  responses:
    AdvisorLimit:
      description: Лимит бюджета, числа запросов или частоты достигнут. Новый платный вызов не выполнялся.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DraftsRequireAuthentication:
      description: Черновики недоступны до подключения авторизации пользователей.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  code: {type: string, const: drafts_require_authentication}
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Не передан Bearer-токен черновика
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Объект не найден или токен не подходит
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Зависимость пока не настроена
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
