name: Check Go backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - shared/api/**
      - .github/workflows/check-backend.yml
  pull_request:
    paths:
      - backend/**
      - shared/api/**
      - .github/workflows/check-backend.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api
