name: Check Go backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - shared/api/**
      - .github/workflows/check-backend.yml
  pull_request:
    paths:
      - backend/**
      - shared/api/**
      - .github/workflows/check-backend.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/
            /content/character-creation.json
            /content/races.json
            /content/rules.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify format gate and check new Go files
        run: |
          python3 -m unittest discover -s scripts -p 'test_code_style.py'
          python3 scripts/check_code_style.py
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api
