name: Check draft character abilities

on:
  push:
    branches: [main]
    paths:
      - 'docs/architecture/character-abilities-v1/**'
      - 'shared/api/proposals/character-abilities-v1.yaml'
      - 'backend/scripts/verify_ability_proposal.py'
      - 'content/character-creation.json'
      - 'content/characters.json'
      - 'content/rules.json'
      - '.github/workflows/check-character-abilities.yml'
  pull_request:
    paths:
      - 'docs/architecture/character-abilities-v1/**'
      - 'shared/api/proposals/character-abilities-v1.yaml'
      - 'backend/scripts/verify_ability_proposal.py'
      - 'content/character-creation.json'
      - 'content/characters.json'
      - 'content/rules.json'
      - '.github/workflows/check-character-abilities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/scripts/verify_ability_proposal.py
            /docs/architecture/character-abilities-v1/
            /shared/api/proposals/character-abilities-v1.yaml
            /content/character-creation.json
            /content/characters.json
            /content/rules.json
      - name: Install schema validation tools in isolated CI environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ability-proposal-venv"
          "$RUNNER_TEMP/ability-proposal-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
      - name: Validate proposal and calculate bounds
        run: |
          "$RUNNER_TEMP/ability-proposal-venv/bin/python" backend/scripts/verify_ability_proposal.py | tee "$RUNNER_TEMP/ability-bounds.txt"
          cat "$RUNNER_TEMP/ability-bounds.txt" >> "$GITHUB_STEP_SUMMARY"
